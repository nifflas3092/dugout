<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://nominatim.openstreetmap.org https://api.mapbox.com https://api.met.no; frame-src https://www.google.com https://maps.google.com; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gear admin · Dugout</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#1e2a44">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700&display=swap">
<link rel="stylesheet" href="style.css">
<!-- Supabase's library, pinned to one version and checked with a hash: if the CDN ever served anything else, the browser refuses to run it -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.js" integrity="sha384-TcHRA3zBbn+Lexh5n+Oil4guNPOS3rjNDpGRAN46u/s/mB2IZ50ceC6TYDU2yvgK" crossorigin="anonymous"></script>
</head>
<body class="admin">
<div class="wrap admin-wrap">
  <header class="top">
    <div class="crest" aria-hidden="true">D</div>
    <div class="teamname"><h1>Gear admin</h1><p>Dugout marketplace moderation</p></div>
    <div class="tools"><a class="chip-btn" href="./#gear">Back to Dugout</a></div>
  </header>
  <nav class="seg admin-tabs" id="atabs" role="tablist" aria-label="Admin sections" hidden>
    <button type="button" role="tab" data-at="overview">Overview</button>
    <button type="button" role="tab" data-at="reports">Reports <span class="badge" id="repBadge" hidden></span></button>
    <button type="button" role="tab" data-at="flags">Scam flags <span class="badge" id="flagBadge" hidden></span></button>
    <button type="button" role="tab" data-at="listings">Listings</button>
    <button type="button" role="tab" data-at="bans">Bans</button>
    <button type="button" role="tab" data-at="activity">Activity</button>
  </nav>
  <main id="aview" aria-live="polite"><p class="muted">Loading…</p></main>
</div>
<dialog class="menu" id="adlg" aria-labelledby="adlgT"></dialog>
<div id="toast" role="status" hidden></div>
<script type="module" src="js/prefs.js"></script>
<script type="module" src="js/admin.js"></script>
</body>
</html>
